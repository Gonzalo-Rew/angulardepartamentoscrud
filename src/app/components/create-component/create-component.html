<h1>Crear departamento</h1>

<form createForm="ngForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="numero" class="form-label">Número</label>
    <input
      type="number"
      class="form-control"
      id="numero"
      name="numero"
      [(ngModel)]="departamento.numero"
      required
    />
  </div>
  <div class="mb-3">
    <label for="nombre" class="form-label">Nombre</label>
    <input
      type="text"
      class="form-control"
      id="nombre"
      name="nombre"
      [(ngModel)]="departamento.nombre"
      required
    />
  </div>
  <div class="mb-3">
    <label for="localidad" class="form-label">Localidad</label>
    <input
      type="text"
      class="form-control"
      id="localidad"
      name="localidad"
      [(ngModel)]="departamento.localidad"
      required
    />
  </div>
  <button type="submit" class="btn btn-primary">Crear</button>
</form>
