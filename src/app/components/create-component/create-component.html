<main class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="card-title mb-4">Crear departamento</h1>

      <form createForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="numero" class="form-label">Número</label>
          <input
            type="number"
            class="form-control"
            id="numero"
            name="numero"
            [(ngModel)]="departamento.numero"
            required
          />
        </div>

        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            name="nombre"
            [(ngModel)]="departamento.nombre"
            required
          />
        </div>

        <div class="mb-3">
          <label for="localidad" class="form-label">Localidad</label>
          <input
            type="text"
            class="form-control"
            id="localidad"
            name="localidad"
            [(ngModel)]="departamento.localidad"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Crear</button>
      </form>

      @if (mensaje) {
        <div class="alert alert-info mt-4 mb-0" role="alert">
          {{ mensaje }}
        </div>
      }
    </div>
  </div>
</main>
