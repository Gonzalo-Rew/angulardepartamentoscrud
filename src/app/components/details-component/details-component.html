<main class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="card-title mb-4">Detalles del departamento</h1>

      @if (departamento) {
        <div class="list-group mb-4">
          <div class="list-group-item">
            <span class="fw-semibold">Número:</span>
            {{ departamento.numero }}
          </div>
          <div class="list-group-item">
            <span class="fw-semibold">Nombre:</span>
            {{ departamento.nombre }}
          </div>
          <div class="list-group-item">
            <span class="fw-semibold">Localidad:</span>
            {{ departamento.localidad }}
          </div>
        </div>
      } @else {
        <div class="alert alert-warning mb-4" role="alert">
          No se encontró el departamento.
        </div>
      }

      <a [routerLink]="['/']" class="btn btn-outline-primary">Volver</a>
    </div>
  </div>
</main>
