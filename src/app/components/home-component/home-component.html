<main class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="card-title mb-4">Departamentos</h1>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th scope="col">Número</th>
              <th scope="col">Nombre</th>
              <th scope="col">Localidad</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody>
            @for (item of departametos; track item.numero) {
              <tr>
                <td>{{ item.numero }}</td>
                <td>{{ item.nombre }}</td>
                <td>{{ item.localidad }}</td>
                <td>
                  <a [routerLink]="['/details', item.numero, item.nombre, item.localidad]" class="btn btn-sm btn-outline-primary">Detalles</a>
                  <a [routerLink]="['/update', item.numero]" class="btn btn-sm btn-outline-warning ms-2">Editar</a>
                  <button (click)="deleteDepartamento(item.numero)" class="btn btn-sm btn-outline-danger ms-2">Eliminar</button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
